  <title>SKARE — Routine Skincare</title>

  <!-- PWA : installable + hors-ligne -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SKARE" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    /* Pas de sélection de texte ni de menu contextuel (sauf champs de saisie) */
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* La PAGE ne défile jamais : hauteur exacte du viewport + overflow caché.
       Cela empêche l'« aspiration » du premier toucher (un #root plus haut que
       l'écran rendait le document scrollable). On reste en FLUX normal (pas de
       body position:fixed) car sur iOS standalone un body fixe se dimensionne
       parfois plus court que l'écran et laisse une bande (« footer ») en bas.
       Le plein écran est assuré par la coque React (App root: fixed; inset:0). */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff5ee; }
    body { font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      overscroll-behavior: none; touch-action: manipulation; } /* manipulation = pas de double-tap zoom */
    #root { height: 100%; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    /* La saisie reste sélectionnable */
    input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  </style>

  <!-- Libs auto-hébergées (offline-first ; remplacent les CDN unpkg) -->
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/dexie.min.js"></script>

  <!-- Données (seed, plain JS) + couche base locale Dexie
       (le catalogue est chargé depuis products.json par skare-db.js) -->
  <script src="skare-data.js"></script>
  <script src="skare-db.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Scaffolds -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Composants SKARE -->
  <script type="text/babel" src="skare-icons.jsx"></script>
  <script type="text/babel" src="skare-timer.jsx"></script>
  <script type="text/babel" src="skare-card.jsx"></script>
  <script type="text/babel" src="skare-editor.jsx"></script>
  <script type="text/babel" src="skare-products.jsx"></script>
  <script type="text/babel" src="skare-journal.jsx"></script>
  <script type="text/babel" src="skare-app.jsx"></script>

  <!-- Désactive le zoom (pinch iOS) — appli mobile plein écran -->
  <script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  </script>

  <!-- PWA : enregistrement du service worker (coque hors-ligne) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SKARE — échec d’enregistrement du service worker', err);
        });
      });
    }
  </script>
</body>
